name: Build clean Quake II PS3 engine-only PKG

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-quake2-engine-pkg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine-only-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out toolchain helper repository
        uses: actions/checkout@v6

      - name: Check out Quake II PS3 source
        uses: actions/checkout@v6
        with:
          repository: kevums/quake-ii-ps3-v221
          ref: main
          path: quake-src

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils file curl ca-certificates python3 tar gzip

      - name: Download, verify, and install precompiled Bucanero PS3DEV/PSL1GHT
        shell: bash
        run: |
          set -euo pipefail
          readonly URL="https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz"
          readonly SHA256="76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900"
          mkdir -p "$RUNNER_TEMP/sdk-extract"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --output "$RUNNER_TEMP/ps3dev.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/ps3dev.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$RUNNER_TEMP/sdk-extract"
          test -x "$RUNNER_TEMP/sdk-extract/ps3dev/ppu/bin/ppu-gcc"
          test -x "$RUNNER_TEMP/sdk-extract/ps3dev/ppu/bin/ppu-strip"
          test -f "$RUNNER_TEMP/sdk-extract/ps3dev/ppu_rules"
          mv "$RUNNER_TEMP/sdk-extract/ps3dev" "$RUNNER_TEMP/ps3dev"
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PORTLIBS=$RUNNER_TEMP/ps3dev/portlibs/ppu" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/ps3dev/bin" \
            "$RUNNER_TEMP/ps3dev/ppu/bin" "$RUNNER_TEMP/ps3dev/spu/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ps3dev/ppu/bin/ppu-gcc" --version
          "$RUNNER_TEMP/ps3dev/spu/bin/spu-gcc" --version

      - name: Remove proprietary payloads and patch missing-data warning
        shell: bash
        working-directory: quake-src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          def replace_once(name, old, new):
              p = root / name
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected exactly one patch anchor, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/backends/ps3/system.c",
              "#include <sysutil/osk.h>\n#include <sysutil/sysutil.h>",
              "#include <sysutil/osk.h>\n#include <sysutil/msg.h>\n#include <sysutil/sysutil.h>",
          )
          missing_data = r'''
          /* Use a native PS3 dialog because renderer fonts may themselves be inside the missing PAK files. */
          static volatile qboolean ps3_missing_data_dialog_finished = false;

          static void
          Sys_PS3_MissingDataDialogCallback(msgButton button, void *userdata)
          {
              (void)userdata;
              if (button != MSG_DIALOG_BTN_INVALID)
                  ps3_missing_data_dialog_finished = true;
          }

          void
          Sys_PS3_ShowMissingGameDataWarning(void)
          {
              struct stat pak_stat;
              static const char *pak_path =
                  "/dev_hdd0/game/QUAKE2000/USRDIR/baseq2/pak0.pak";
              static const char *warning =
                  "Quake II game data was not found.\n\n"
                  "This PKG contains the engine only. Copy legally acquired Quake II\n"
                  "baseq2 PAK files to:\n"
                  "/dev_hdd0/game/QUAKE2000/USRDIR/baseq2/\n\n"
                  "Close this message and launch the game again.";
              s32 dialog_result;

              if (stat(pak_path, &pak_stat) == 0 && S_ISREG(pak_stat.st_mode) &&
                  pak_stat.st_size > 0)
                  return;

              Sys_BootTrace("startup: pak0.pak missing; showing data warning", false);
              if (ps3_sysutil_registered)
              {
                  ps3_missing_data_dialog_finished = false;
                  dialog_result = msgDialogOpen2(
                      (msgType)(MSG_DIALOG_NORMAL | MSG_DIALOG_BTN_TYPE_OK),
                      warning, Sys_PS3_MissingDataDialogCallback, NULL, NULL);
                  if (dialog_result == SYSUTIL_OK)
                  {
                      while (!ps3_missing_data_dialog_finished && !ps3_exit_requested)
                      {
                          (void)sysUtilCheckCallback();
                          Sys_Nanosleep(1000000);
                      }
                      (void)msgDialogAbort();
                  }
                  else
                  {
                      Sys_BootTrace("startup: missing-data dialog failed to open", false);
                  }
              }

              Sys_BootTrace("startup: exiting because game data is absent", false);
              Sys_PS3_UnregisterCallback();
              exit(0);
          }

          '''
          replace_once(
              "src/backends/ps3/system.c",
              "// ---------------------------------------------\n//  Input/Output\n// ---------------------------------------------",
              missing_data + "// ---------------------------------------------\n//  Input/Output\n// ---------------------------------------------",
          )
          replace_once(
              "src/common/header/common.h",
              "void Sys_BootTrace(const char *stage, qboolean reset);\n",
              "void Sys_BootTrace(const char *stage, qboolean reset);\nvoid Sys_PS3_ShowMissingGameDataWarning(void);\n",
          )
          replace_once(
              "src/common/frame_ps3.c",
              'Sys_Init();\n\tPS3_BOOT_TRACE("Qcommon_Init: before NET_Init");',
              'Sys_Init();\n\tSys_PS3_ShowMissingGameDataWarning();\n\tPS3_BOOT_TRACE("Qcommon_Init: before NET_Init");',
          )
          # Remove the disc/ISO build option from this cleaned source distribution.
          makefile = root / "Makefile.ps3"
          m = makefile.read_text(encoding="utf-8")
          for anchor in ("PS3_DISC_BUILD ?= 0\n", "ifeq ($(PS3_DISC_BUILD),1)\nCFLAGS += -DPS3_DISC_BUILD\nendif\n"):
              if m.count(anchor) != 1:
                  raise SystemExit(f"Makefile.ps3: expected exactly one ISO/disc switch, found {m.count(anchor)}")
              m = m.replace(anchor, "", 1)
          makefile.write_text(m, encoding="utf-8")

          (root / "README.md").write_text("""# Quake II PS3 — engine-only homebrew build

This repository is a source build of the PS3 port. It does not distribute
commercial Quake II game data, original game artwork, release binaries, or an
ISO workflow.

The generated PKG contains the engine only. It does not include PAK files.
At startup the executable checks for `baseq2/pak0.pak`; if it is missing, a
native PS3 on-screen dialog explains the required path and the application exits.

Copy legally acquired Quake II base-game PAK files to:
`/dev_hdd0/game/QUAKE2000/USRDIR/baseq2/`

The source retains its upstream licensing. Quake II trademarks and commercial
game data remain the property of their respective owners.
""", encoding="utf-8")
          (root / "docs/BUILDING.md").write_text("""# Build the engine-only PS3 PKG

Build with a Bucanero/PSL1GHT PS3DEV installation. The PKG deliberately excludes
game data and no ISO target is used.

The CI build uses the precompiled Linux x86-64 SDK and runs:
```sh
make -f Makefile.ps3 -j1 BUILD=build-rsx TARGET=q2ps3 \\
  TITLE="Quake II PS3 (game data required)" APPID=QUAKE2000 \\
  CONTENTID=UP0001-QUAKE2000_00-0000000000000000 \\
  ICON0="$PS3DEV/bin/ICON0.PNG" PKGFILES= \\
  PS3_NATIVE_RSX=1 PS3_CAMERA=0 PS3_MOVE=0 \\
  PS3_V198_OSK_RECOVERY=1 PS3_FORCE_FONT_SAMPLER_PER_DRAW=1 \\
  PS3_USB_INPUT_BRIDGE=0 PS3_POLYBLEND_2D_OVERRIDE=0 \\
  PS3_SCENE_SCALE_BRIDGE=0 PS3_SAFE_VIDEO=0 q2ps3.pkg
```

Never copy `*.pak`, `baseq2/`, private EBOOTs, ISO trees, or release payloads
into the PKG. Physical PS3 testing remains necessary after a successful build.
""", encoding="utf-8")
          (root / "docs/INSTALLATION.md").write_text("""# Installation — engine-only PKG

Install the generated `q2ps3.gnpdrm.pkg` using your PS3 package manager.

The package contains the engine only. Copy legally acquired Quake II base-game
PAK files to:
```text
/dev_hdd0/game/QUAKE2000/USRDIR/baseq2/
```

If `pak0.pak` is missing or empty, the PS3 shows a native warning and exits.
No ISO distribution is supported by this cleaned build.
""", encoding="utf-8")

          import shutil
          for path in ("release-assets", "branding", "stuff/icon", "stuff/osx/quake2-appbundle.zip",
                       "stuff/models/crosshair", "stuff/mapfixes", "param-v221-full.xml",
                       "param-v221-iso.xml"):
              p = root / path
              if p.is_dir(): shutil.rmtree(p)
              elif p.exists(): p.unlink()
          for p in list(root.rglob("*")):
              if ".git" in p.parts or not p.is_file():
                  continue
              if p.suffix.lower() in (".pak", ".pkg", ".iso") or p.name.lower().endswith(".gnpdrm.pkg"):
                  p.unlink()
          PY
          test -z "$(find . -path './.git' -prune -o -type f \( -iname '*.pak' -o -iname '*.iso' \) -print)"
          git diff --check

      - name: Build engine-only NPDRM package
        shell: bash
        working-directory: quake-src
        run: |
          set -euo pipefail
          make -f Makefile.ps3 -j1 \
            BUILD=build-rsx TARGET=q2ps3 \
            'TITLE=Quake II PS3 (game data required)' \
            APPID=QUAKE2000 \
            CONTENTID=UP0001-QUAKE2000_00-0000000000000000 \
            ICON0="$PS3DEV/bin/ICON0.PNG" PKGFILES= \
            PS3_NATIVE_RSX=1 PS3_CAMERA=0 PS3_MOVE=0 \
            PS3_V198_OSK_RECOVERY=1 PS3_FORCE_FONT_SAMPLER_PER_DRAW=1 \
            PS3_USB_INPUT_BRIDGE=0 PS3_POLYBLEND_2D_OVERRIDE=0 \
            PS3_SCENE_SCALE_BRIDGE=0 PS3_SAFE_VIDEO=0 q2ps3.pkg
          test -s q2ps3.elf
          test -s q2ps3.self
          test -s q2ps3.gnpdrm.pkg
          test -s build-rsx/pkg/USRDIR/EBOOT.BIN
          # Ensure no PAK/game assets were copied into staging.
          test -z "$(find build-rsx/pkg -type f \( -iname '*.pak' -o -iname '*.wal' -o -iname '*.pcx' \) -print)"
          "$PS3DEV/ppu/bin/ppu-readelf" -h q2ps3.elf
          file q2ps3.elf q2ps3.self q2ps3.gnpdrm.pkg
          sha256sum q2ps3.gnpdrm.pkg | tee pkg.sha256

      - name: Upload PKG and build verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quake2-ps3-engine-only-pkg
          path: |
            quake-src/q2ps3.gnpdrm.pkg
            quake-src/pkg.sha256
            quake-src/q2ps3.elf
            quake-src/q2ps3.self
            quake-src/README.md
            quake-src/docs/BUILDING.md
          if-no-files-found: warn
          retention-days: 14
