name: Quake II PS3 engine-only PKG build

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-quake2-engine-pkg.yml"
      - "ci/prepare-quake2-engine-only.sh"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Quake II source branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build-engine-only-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out build scripts
        uses: actions/checkout@v6

      - name: Check out Quake II PS3 source
        uses: actions/checkout@v6
        with:
          repository: kevums/quake-ii-ps3-v221
          ref: ${{ inputs.source_ref || 'main' }}
          path: quake-src

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils file curl ca-certificates python3 tar gzip libgl1 libglu1-mesa libx11-6 libxext6 libxi6 libxmu6 libxt6 libsm6 libice6

      - name: Download and verify Bucanero's precompiled PS3DEV/PSL1GHT
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz"
          SHA256="76b1b3bc9ac260a4ece86da520225da7f2f4e334174e37b850093ff925eeb900"
          mkdir -p "$RUNNER_TEMP/sdk-extract"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --output "$RUNNER_TEMP/ps3dev.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/ps3dev.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ps3dev.tar.gz" -C "$RUNNER_TEMP/sdk-extract"
          test -x "$RUNNER_TEMP/sdk-extract/ps3dev/ppu/bin/ppu-gcc"
          test -x "$RUNNER_TEMP/sdk-extract/ps3dev/spu/bin/spu-gcc"
          test -f "$RUNNER_TEMP/sdk-extract/ps3dev/ppu_rules"
          mv "$RUNNER_TEMP/sdk-extract/ps3dev" "$RUNNER_TEMP/ps3dev"
          echo "PS3DEV=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PSL1GHT=$RUNNER_TEMP/ps3dev" >> "$GITHUB_ENV"
          echo "PORTLIBS=$RUNNER_TEMP/ps3dev/portlibs/ppu" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/ps3dev/bin" "$RUNNER_TEMP/ps3dev/ppu/bin" "$RUNNER_TEMP/ps3dev/spu/bin" >> "$GITHUB_PATH"
          # Do not suppress tool output while packaging; make failures diagnosable.
          python3 - "$RUNNER_TEMP/ps3dev/ppu_rules" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          for marker in ("$(SELF_NPDRM)", "$(PKG) --contentid"):
              lines = [line for line in s.splitlines(True) if marker in line]
              if len(lines) != 1 or ">> /dev/null" not in lines[0]:
                  raise SystemExit(f"unexpected PSL1GHT packaging rule for {marker}")
              s = s.replace(lines[0], lines[0].replace(" >> /dev/null", ""), 1)
          p.write_text(s)
          PY
          "$RUNNER_TEMP/ps3dev/ppu/bin/ppu-gcc" --version
          "$RUNNER_TEMP/ps3dev/spu/bin/spu-gcc" --version

      - name: Install NVIDIA Cg Toolkit 3.1 host compiler/runtime (verified)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://developer.download.nvidia.com/cg/Cg_3.1/Cg-3.1_April2012_x86_64.tgz"
          SHA512="591b51195193e7e3bbb9f1c2579336d24a179b0a88b955a01f4661bda55543fbccd73cac53033912f2eea8a1068e4c1394c6d286f195963cfb33a0d8b4428e27"
          CG_ROOT="$RUNNER_TEMP/nvidia-cg-toolkit"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            --output "$RUNNER_TEMP/cg-toolkit.tgz" "$URL"
          echo "$SHA512  $RUNNER_TEMP/cg-toolkit.tgz" | sha512sum --check -
          mkdir -p "$CG_ROOT"
          tar -xzf "$RUNNER_TEMP/cg-toolkit.tgz" -C "$CG_ROOT"
          test -x "$CG_ROOT/usr/bin/cgc"
          test -s "$CG_ROOT/usr/lib64/libCg.so"
          echo "CG_ROOT=$CG_ROOT" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CG_ROOT/usr/lib64:$CG_ROOT/usr/lib" >> "$GITHUB_ENV"
          echo "$CG_ROOT/usr/bin" >> "$GITHUB_PATH"
          export LD_LIBRARY_PATH="$CG_ROOT/usr/lib64:$CG_ROOT/usr/lib"
          ldd "$CG_ROOT/usr/bin/cgc" | tee "$RUNNER_TEMP/cgc-ldd.txt"
          if grep -Fq "not found" "$RUNNER_TEMP/cgc-ldd.txt"; then
            echo "ERROR: NVIDIA Cg compiler has unresolved shared libraries." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/cg-smoke.cg" <<'CG'
          void main(float4 position : POSITION,
                    out float4 outPosition : POSITION)
          {
              outPosition = position;
          }
          CG
          "$CG_ROOT/usr/bin/cgc" -profile vp40 -entry main \
            -o "$RUNNER_TEMP/cg-smoke.vpo" "$RUNNER_TEMP/cg-smoke.cg"
          test -s "$RUNNER_TEMP/cg-smoke.vpo"
          echo "NVIDIA Cg runtime resolved and test vertex shader compiled."

      - name: Prepare clean engine-only source
        working-directory: quake-src
        run: bash "$GITHUB_WORKSPACE/ci/prepare-quake2-engine-only.sh"

      - name: Build installable engine-only package
        working-directory: quake-src
        shell: bash
        run: |
          set -euo pipefail
          # Guard this job to the project's custom native RSX backend.
          # This is the in-tree GL1-to-RSX implementation, not upstream gzorin/RSXGL.
          test -s src/client/refresh/rsx/rsx_gl.c
          test -s src/client/refresh/rsx/rsx_backend.c
          for shader in rsx_fixed.vcg rsx_fixed.fcg rsx_lightmap.vcg rsx_lightmap.fcg rsx_filter.fcg; do
            test -s "src/client/refresh/rsx/shaders/$shader"
          done
          echo "Renderer: in-tree custom native RSX backend (PS3_NATIVE_RSX=1)"
          echo "Quake II source revision: $(git rev-parse HEAD)"
          sha256sum src/client/refresh/rsx/rsx_gl.c src/client/refresh/rsx/rsx_backend.c
          make_args=( \
            BUILD=build-rsx TARGET=q2ps3 \
            "TITLE=Quake II PS3 (game data required)" \
            APPID=QUAKE2000 \
            CONTENTID=UP0001-QUAKE2000_00-0000000000000000 \
            "ICON0=$PS3DEV/bin/ICON0.PNG" PKGFILES= \
            PS3_NATIVE_RSX=1 PS3_CAMERA=0 PS3_MOVE=0 \
            PS3_V198_OSK_RECOVERY=1 PS3_FORCE_FONT_SAMPLER_PER_DRAW=1 \
            PS3_USB_INPUT_BRIDGE=0 PS3_POLYBLEND_2D_OVERRIDE=1 \
            PS3_SCENE_SCALE_BRIDGE=1 PS3_SAFE_VIDEO=0 \
          ) \
          # First run the recursive build target to compile the ELF and SELF. \
          make -f Makefile.ps3 -j1 "${make_args[@]}" \
          # Then run the PSL1GHT package rule using those built outputs. \
          make -f Makefile.ps3 -j1 VERBOSE=1 "${make_args[@]}" q2ps3.pkg
          test -s q2ps3.elf
          test -s q2ps3.self
          test -s q2ps3.gnpdrm.pkg
          test -s build-rsx/pkg/USRDIR/EBOOT.BIN
          test -s build-rsx/rsx_gl.o
          test -s build-rsx/rsx_fixed.vpo.o
          test -s build-rsx/rsx_fixed.fpo.o
          test -s build-rsx/rsx_lightmap.vpo.o
          test -s build-rsx/rsx_lightmap.fpo.o
          test -s build-rsx/rsx_filter.fpo.o
          test ! -e build-rsx/sw_rast.o
          test -z "$(find build-rsx/pkg -type f \( -iname '*.pak' -o -iname '*.wal' -o -iname '*.pcx' \) -print)"
          "$PS3DEV/ppu/bin/ppu-readelf" -h q2ps3.elf
          file q2ps3.elf q2ps3.self q2ps3.gnpdrm.pkg
          sha256sum q2ps3.gnpdrm.pkg | tee pkg.sha256

      - name: Upload PKG and verification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quake2-ps3-engine-only-pkg
          path: |
            quake-src/q2ps3.gnpdrm.pkg
            quake-src/pkg.sha256
            quake-src/q2ps3.elf
            quake-src/q2ps3.self
          if-no-files-found: warn
          retention-days: 30
